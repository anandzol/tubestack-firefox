name: Build and Release Extension

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify conditions (Main branch & First X.Y release only)
        id: check
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "Tag pushed: $TAG_NAME"

          # 1. Ensure the tagged commit exists on the main branch
          COMMIT_SHA=$(git rev-parse "$TAG_NAME")
          if ! git branch --remote --contains "$COMMIT_SHA" | grep -q 'origin/main'; then
            echo "ERROR: Tag $TAG_NAME is not on the main branch. Skipping release."
            exit 1
          fi

          # 2. Only release when X or Y changes (i.e. the first tag for a given vX.Y prefix).
          #    Patch-only bumps (e.g. v0.1.1, v0.1.2) are skipped because the vX.Y prefix
          #    already has a prior tag. A new minor/major (e.g. v0.2.0, v1.0.0, v2.3.1 when
          #    the last release was v2.2.x) will have no prior tag under that vX.Y and will release.
          X=$(echo "$TAG_NAME" | grep -oP '(?<=v)\d+')
          Y=$(echo "$TAG_NAME" | cut -d. -f2)

          # Count tags sharing the same vX.Y.* prefix (including the current tag itself)
          MATCHING=$(git tag --list "v${X}.${Y}.*" | wc -l)
          echo "Tags found for v${X}.${Y}.*: $MATCHING"

          if [ "$MATCHING" -gt 1 ]; then
            echo "INFO: A prior release already exists for v${X}.${Y}. This is a patch bump — skipping release."
            exit 1
          fi

          echo "First tag under v${X}.${Y} — proceeding with release."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Verify build output
        run: |
          echo "Checking build output..."
          test -f dist/content-bundle.js || { echo "ERROR: dist/content-bundle.js not found"; exit 1; }
          test -f dist/content-bundle.css || { echo "ERROR: dist/content-bundle.css not found"; exit 1; }
          test -f dist/background.js     || { echo "ERROR: dist/background.js not found"; exit 1; }
          test -f dist/popup.html        || { echo "ERROR: dist/popup.html not found"; exit 1; }
          test -f dist/popup.js          || { echo "ERROR: dist/popup.js not found"; exit 1; }
          echo "All expected build artifacts present."

      - name: Package extension
        run: |
          # Only include files needed for the extension to run.
          # Excludes screenshots and other repo-only assets.
          zip -r tubestack-${{ github.ref_name }}.zip \
            manifest.json \
            LICENSE \
            dist/ \
            assets/icons/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TubeStack ${{ github.ref_name }}
          files: tubestack-${{ github.ref_name }}.zip
          generate_release_notes: true
